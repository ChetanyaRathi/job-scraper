services:
  postgres:
    image: postgres:16-alpine
    container_name: job-scraper-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jobscraper
      POSTGRES_PASSWORD: jobscraper
      POSTGRES_DB: jobscraper
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
